server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: luxury-car-rental-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:carrentaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 25MB

app:
  jwt:
    secret: 9a6f8b12c4d5e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2
    expiration-ms: 86400000 # 24 hours
  admin:
    default-email: ${ADMIN_EMAIL:admin@luxurycars.com}
    default-password: ${ADMIN_PASSWORD:admin123}
    default-name: Executive Administrator

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
